<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birlik Moderatör Performans Takip</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-content">
                <h1><i class="fa-solid fa-shield-halved"></i> Birlik Moderatör Performans Takip</h1>
                <p>Haftalık / Aylık moderatör istatistikleri ve kategorizasyon paneli</p>
            </div>
            <div class="header-actions">
                <button id="add-row-btn" class="btn primary-btn"><i class="fa-solid fa-plus"></i> Moderatör Ekle</button>
                <button id="export-discord-btn" class="btn discord-btn"><i class="fa-brands fa-discord"></i> Discord İçin Kopyala</button>
                <button id="clear-data-btn" class="btn danger-btn"><i class="fa-solid fa-trash"></i> Verileri Temizle</button>
            </div>
        </header>

        <div class="table-container">
            <table id="mod-table">
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th>Kişiler (Rol/ID)</th>
                        <th>Önceki Süre</th>
                        <th>Streamer</th>
                        <th>Public</th>
                        <th>Süreler (Toplam)</th>
                        <th>GHGP %</th>
                        <th>Kategori</th>
                        <th>Sil</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows will be injected by JS -->
                </tbody>
            </table>
        </div>
        
        <div id="toast-container"></div>
    </div>
    
    <template id="row-template">
        <tr class="mod-row">
            <td><input type="text" class="input-nick" placeholder="Nick"></td>
            <td><input type="text" class="input-kisiler" placeholder="Kişiler"></td>
            <td><input type="number" class="input-old" placeholder="0" min="0" step="0.1"></td>
            <td><input type="number" class="input-streamer" placeholder="0" min="0" step="0.1"></td>
            <td><input type="number" class="input-public" placeholder="0" min="0" step="0.1"></td>
            <td class="cell-total">0</td>
            <td class="cell-ghgp"><span class="ghgp-badge neutral">0%</span></td>
            <td class="cell-category"><span class="category-badge none">Belirsiz</span></td>
            <td><button class="btn-icon delete-btn"><i class="fa-solid fa-xmark"></i></button></td>
        </tr>
    </template>

    <script src="script.js"></script>
</body>
</html>
